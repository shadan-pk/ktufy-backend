name: Deploy to Azure VM

on:
  push:
    branches:
      - v5.0    # your current branch
  workflow_dispatch:  # manual trigger

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Run tests
        run: echo "Tests passed"   # replace with pytest later

  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: SSH and Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AZURE_VM_IP }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -e
            cd /home/azureuser/ktufy-backend

            echo "→ Pulling latest code..."
            git config pull.rebase false
            git fetch origin v5.0
            git reset --hard origin/v5.0

            echo "→ Rebuilding containers..."
            # build first without stopping
            docker compose build

            echo "→ Restarting services (Clean)..."
            # down/up ensures Nginx re-resolves the backend IP and clean state
            docker compose down
            docker compose up -d

            echo "→ Cleaning old images..."
            docker image prune -f

            echo "→ Waiting for backend to be healthy (ML models loading)..."
            # Wait up to 2 minutes for model loading
            for i in {1..24}; do
              if curl -s --fail http://localhost/health > /dev/null; then
                echo "✅ Backend is UP and Healthy!"
                docker compose ps
                exit 0
              fi
              echo "...waiting for healthy backend ($((i*5))s)..."
              sleep 5
            done

            echo "❌ Backend failed to start or health check failed."
            docker compose logs backend --tail 50
            exit 1