version: "3.9"

services:
  backend:
    build: .
    container_name: ktufy-backend
    env_file: .env
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - HF_HOME=/app/.cache/hf
      - TRANSFORMERS_CACHE=/app/.cache/hf
      - SENTENCE_TRANSFORMERS_HOME=/app/.cache/hf
      - NEO4J_URI=bolt://neo4j:7687
    expose:
      - "8000"
    volumes:
      - uploads_data:/app/uploads
      - vector_data:/app/vector_store
    depends_on:
      neo4j:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    image: nginx:alpine
    container_name: ktufy-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  neo4j:
    image: neo4j:5-community
    container_name: ktufy-neo4j
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-changeme}
      - NEO4J_PLUGINS=["apoc"]
    mem_limit: 2g
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  redis:
    image: redis:7-alpine
    container_name: ktufy-redis
    expose:
      - "6379"
    restart: unless-stopped

volumes:
  uploads_data:
  vector_data:
  neo4j_data:
