limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

upstream backend {
    server backend:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name api.ktufy.app;

    # Larger body size for media uploads
    client_max_body_size 200M;
    
    # Increase buffers to prevent temporary file writes
    client_body_buffer_size 10M;
    proxy_buffer_size 10M;
    proxy_buffers 16 10M;
    proxy_busy_buffers_size 20M;
    
    # Increase temp file size before writing to disk
    client_body_temp_path /var/cache/nginx/client_temp 1 2;
    proxy_temp_path /var/cache/nginx/proxy_temp 1 2;
    
    # Longer timeouts for media processing
    client_body_timeout 300s;
    send_timeout 300s;

    limit_req zone=api burst=20 nodelay;

    location / {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Longer timeouts for media operations
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        
        # Prevent buffering to disk
        proxy_buffering on;
        proxy_max_temp_file_size 0;
    }

    location /health {
        proxy_pass http://backend/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;
    }
}